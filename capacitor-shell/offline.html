<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f5ef" />
    <title>find·a·day</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: #f8f5ef;
        color: #2e2a26;
        font: 17px/1.45 ui-rounded, -apple-system, BlinkMacSystemFont, sans-serif;
        text-transform: lowercase;
        text-align: center;
      }
      main { max-width: 28rem; }
      h1 { margin: 0 0 12px; font-family: ui-serif, Georgia, serif; font-size: 2.25rem; }
      p { margin: 0 0 22px; color: #6f675f; }
      button {
        min-height: 48px;
        padding: 0 24px;
        border: 0;
        border-radius: 12px;
        background: #df684f;
        color: #fff;
        font: inherit;
        font-weight: 700;
        text-transform: lowercase;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #201d1a; color: #f6efe8; }
        p { color: #bcb2a8; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>find·a·day</h1>
      <p>you’re offline. reconnect, then try again.</p>
      <button type="button" onclick="location.reload()">try again</button>
    </main>
  </body>
</html>
